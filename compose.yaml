name: creator-ai

x-app: &app
  image: creator-ai-server:0.1.0
  build:
    context: .
    dockerfile: infra/docker/server.Dockerfile
  environment: &app-env
    NODE_ENV: production
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
    DATABASE_URL: postgres://creator:${DB_PASSWORD:?Set DB_PASSWORD in .env}@database:5432/creator
    REDIS_URL: redis://redis:6379/0
    MODEL_MODE: ${MODEL_MODE:-mock}
    MODEL_ENCRYPTION_KEY: ${MODEL_ENCRYPTION_KEY:-}
    MODEL_ALLOWED_HOSTS: ${MODEL_ALLOWED_HOSTS:-}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  networks:
    - private
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  gateway:
    image: creator-ai-web:0.1.0
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - private
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api:
    <<: *app
    command: ['node', 'dist/main-api.js']
    networks:
      - private
      - model_egress
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

  worker:
    <<: *app
    command: ['node', 'dist/main-worker.js']
    networks:
      - private
      - model_egress
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

  database:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: creator
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creator -d creator']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.2.17-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

networks:
  public:
  model_egress:
  private:
    internal: true

volumes:
  database_data:
  redis_data:
  caddy_data:
  caddy_config:
