name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      database:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: ci-only-secret
          POSTGRES_DB: creator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U creator -d creator_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.2.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://creator:ci-only-secret@127.0.0.1:5432/creator_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: pnpm --filter @creator-ai/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:docker
      - name: Check production Compose entry point
        run: |
          node scripts/production.mjs init --origin https://creator.example.com --model-hosts api.example.com --env-file "$RUNNER_TEMP/creator-ai-production.env"
          node scripts/production.mjs check --env-file "$RUNNER_TEMP/creator-ai-production.env"
      - run: pnpm release:package
      - uses: actions/upload-artifact@v4
        with:
          name: creator-ai-source-release
          path: |
            dist/releases/*/creator-ai-*.tar.gz
            dist/releases/*/creator-ai-*.tar.gz.sha256
